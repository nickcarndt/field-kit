[project]
name = "fieldkit-mcp"
version = "0.1.0"
description = "FieldKit MCP server — Anthropic-aligned reference architectures as queryable tools"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the 1.x API (FastMCP): 2.0 rewrote the high-level server API
    # days before this build's freeze. Migration is post-freeze work.
    "mcp[cli]>=1.2,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
